<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5A4F">
<title>CIB Spending</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1D5A4F; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #E9EFEB; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #E9EFEB; }
  .setup { max-width: 460px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top, 0px)) 22px 32px; }
  .setup img { width: 72px; height: 72px; border-radius: 16px; display: block; margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0 0 8px; font-weight: 600; }
  p { color: #BFD3CC; line-height: 1.5; margin: 0 0 20px; }
  label { display: block; font-size: 14px; margin-bottom: 6px; color: #BFD3CC; }
  input { width: 100%; box-sizing: border-box; height: 48px; padding: 0 12px; border-radius: 8px; border: 1px solid #3E8A7A; background: #15302B; color: #E9EFEB; font: inherit; }
  button { margin-top: 14px; width: 100%; height: 50px; border: 0; border-radius: 25px; background: #E9EFEB; color: #1D5A4F; font: inherit; font-weight: 600; }
  .err { color: #F2A48F; min-height: 20px; margin-top: 8px; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="setup" id="setup" hidden>
    <img src="icon-192.png" alt="">
    <h1>CIB Spending</h1>
    <p>Paste your dashboard link once. It stays saved on this phone only.</p>
    <label for="link">Dashboard link (the one ending with ?key=…)</label>
    <input id="link" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec?key=…">
    <div class="err" id="err" role="alert"></div>
    <button id="save">Open dashboard</button>
  </div>

<script>
  const STORE = 'cibSpendingLink';
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) { try { localStorage.removeItem(STORE); } catch (e) {} history.replaceState(null, '', location.pathname); }

  let link = null;
  try { link = localStorage.getItem(STORE); } catch (e) {}

  function openDashboard(url) {
    document.getElementById('setup').hidden = true;
    const f = document.createElement('iframe');
    f.src = url; f.title = 'CIB Spending dashboard';
    document.body.appendChild(f);
  }

  if (link) openDashboard(link);
  else document.getElementById('setup').hidden = false;

  document.getElementById('save').onclick = () => {
    const v = document.getElementById('link').value.trim();
    const ok = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec\?key=.+/.test(v);
    if (!ok) { document.getElementById('err').textContent = 'That link should start with https://script.google.com/macros/s/ and end with ?key=your-secret.'; return; }
    try { localStorage.setItem(STORE, v); } catch (e) {}
    openDashboard(v);
  };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
